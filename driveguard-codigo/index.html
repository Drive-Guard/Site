<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveGuard — Dashboard de Fadiga</title>
    <meta
      name="description"
      content="Monitoramento de fadiga e prevenção de acidentes por sonolência em frotas de transporte."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2314b8a6' d='M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5Zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z'/></svg>" />
    <script>
      // Aplica o tema salvo antes do primeiro desenho (ver src/lib/tema.tsx).
      (function () {
        try {
          var p = localStorage.getItem("dg-tema") || "sistema";
          var escuro = p === "escuro" || (p === "sistema" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
